name: Breakout Retest Alerts

on:
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: breakout-retest-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Tickers narrowed to ES/NQ — the only two instruments this
          # strategy has actually been backtested and validated on
          # (see OPTIMIZATION_REPORT.md / COMBINED_ES_NQ_REPORT.md).
          # Swap in MES=F,MNQ=F for the micro contracts if you're sizing
          # smaller — same price action, 1/10th the point value.
          # Strategy params are left at their validated defaults
          # (pivot=7, retest_window=25, tolerance=0.15, rr_target=2.5,
          # no session filter) baked into live_alert_bot.py; override with
          # extra flags here only if you've re-validated a different config.
          python live_alert_bot.py \
            --tickers ES=F,NQ=F \
            --once \
            --telegram-token "$TELEGRAM_TOKEN" \
            --telegram-chat-id "$TELEGRAM_CHAT_ID"

      - name: Save alert state back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_state.json
          git diff --cached --quiet || git commit -m "Update alert state [skip ci]"
          git pull --rebase origin main
          git push
