name: Breakout Retest Alerts

on:
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log signals instead of sending to Telegram)"
        required: false
        default: "false"

concurrency:
  group: breakout-retest-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run breakout-retest signal bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        # Symbols (ES=F, NQ=F) and strategy params (pivot=7, retest_window=25,
        # tolerance=0.15, rr_target=2.5, no session filter) are the validated
        # defaults baked into the SYMBOLS list at the top of
        # breakout_retest_signal_bot.py — edit that file to change them.
        run: python breakout_retest_signal_bot.py

      - name: Save alert state back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_state.json
          git diff --cached --quiet || git commit -m "Update alert state [skip ci]"
          git pull --rebase origin main
          git push
